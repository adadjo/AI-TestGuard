name: experiments

# Expériences coûteuses : déclenchement manuel ou hebdomadaire, jamais à chaque Pull Request.
on:
  workflow_dispatch:
    inputs:
      use_kaggle:
        description: "Télécharger le jeu Kaggle (secrets KAGGLE_USERNAME / KAGGLE_KEY requis)"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 1" # chaque lundi à 03:00 UTC

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests complets (y compris les tests lents)
        run: pytest -m "not full_data" --cov=app --cov-report=term-missing
      - name: Télécharger le jeu Kaggle (optionnel)
        if: ${{ inputs.use_kaggle && env.KAGGLE_KEY != '' }}
        run: |
          pip install kaggle
          kaggle datasets download -d mlg-ulb/creditcardfraud -p data --unzip
      - name: Expériences complètes (jeu réel si présent, sinon proxy synthétique étiqueté)
        run: python scripts/run_all.py --allow-synthetic-fallback
      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-experiences
          path: reports/
